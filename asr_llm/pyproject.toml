[project]
name = "medpark-asr-llm"
version = "0.1.0"
description = "On-premise multilingual ASR + local LLM minutes extraction for Medpark"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "numpy>=2.0",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
mlx = ["mlx-whisper>=0.4"]
cpu = ["faster-whisper>=1.1"]
dev = ["pytest>=8.3"]

[project.scripts]
mom-asr = "asr_llm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
