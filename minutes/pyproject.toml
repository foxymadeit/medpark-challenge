[project]
name = "mom"
version = "0.1.0"
description = "Liminal minutes: transcript to checked Medpark minutes (PDF and DOCX, RO/RU/EN), fully offline"
requires-python = ">=3.10"
dependencies = [
  "python-docx>=1.1",
  "rapidfuzz>=3.6",   # C++ fuzzy matching for the quote check
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mom = "mom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mom"]
