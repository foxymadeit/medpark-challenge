[project]
name = "medpark-asr-llm"
version = "0.1.0"
description = "On-premise ASR + local LLM minutes for a 16GB GPU or 32GB CPU host"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.12",
  "numpy>=2.0",
  "pydantic-settings>=2.6",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.1"]
llm = ["llama-cpp-python>=0.3.0"]
dev = ["pytest>=8.3"]

[project.scripts]
mom-asr = "asr_llm.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["asr_llm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
