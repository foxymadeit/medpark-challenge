[project]
name = "diarizer"
version = "0.1.0"
description = "Offline speaker diarization for Secure MOM: live mic and recorded files"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "sherpa-onnx>=1.12",
  # onnxruntime stopped shipping Intel Mac wheels after 1.23.2
  "onnxruntime==1.23.2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "onnxruntime>=1.23; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
diarizer = "diarizer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
